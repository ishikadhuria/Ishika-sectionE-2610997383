<!DOCTYPE html>
<html>
<head>
    <title>Readers' Haven - Book Registration & Order Form</title>
</head>
<body>

    <h1>Readers' Haven - Book Registration & Order Form</h1>

    <p>Welcome to Readers' Haven! Register your details and
    place your favourite book order online.</p>

    <form action="#" target="_self" method="post">

        <h2>Customer Details</h2>

        <label for="name">Customer Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>
        <br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile"
               placeholder="Enter mobile number" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"
               placeholder="Enter your age">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Enter password" required>
        <br><br>

        <h2>Book Details</h2>

        <label for="category">Favorite Book Category:</label>
        <select id="category" name="category" required>
            <option value="">--Select Category--</option>
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
            <option value="Children's Books">Children's Books</option>
        </select>
        <br><br>

        <label for="date">Delivery Date:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <label for="time">Preferred Delivery Time:</label>
        <input type="time" id="time" name="time">
        <br><br>

        <label for="book">Book Title:</label>
        <input type="text" id="book" name="book"
               placeholder="Enter book title">
        <br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity"
               min="1" value="1">
        <br><br>

        <h2>Payment Method</h2>

        <input type="radio" id="cod" name="payment"
               value="Cash on Delivery">
        <label for="cod">Cash on Delivery</label>

        <input type="radio" id="online" name="payment"
               value="Online Payment">
        <label for="online">Online Payment</label>
        <br><br>

        <h2>Additional Services</h2>

        <input type="checkbox" id="gift" name="services"
               value="Gift Wrapping">
        <label for="gift">Gift Wrapping</label>
        <br>

        <input type="checkbox" id="express" name="services"
               value="Bookmark Express Delivery">
        <label for="express">Bookmark Express Delivery</label>
        <br>

        <input type="checkbox" id="card" name="services"
               value="Greeting Card">
        <label for="card">Greeting Card</label>
        <br><br>

        <input type="hidden" name="formname"
               value="Readers Haven Book Order">

        <label for="file">Upload Reference Image/Document:</label>
        <input type="file" id="file" name="file"
               accept="image/*,.pdf,.doc,.docx">
        <br><br>

        <h2>Delivery Information</h2>

        <label for="address">Delivery Address:</label>
        <br>
        <textarea id="address" name="address" rows="4" cols="35"
                  placeholder="Enter your delivery address"></textarea>
        <br><br>

        <label for="instructions">Special Instructions:</label>
        <br>
        <textarea id="instructions" name="instructions"
                  rows="4" cols="35"
                  placeholder="Enter special instructions"></textarea>
        <br><br>

        <button type="submit">Submit Order</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
